<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="./favicon-64.png?v=2"
    />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFC53D" />
    <meta
      name="description"
      content="Descubre hasta qué hora da el sol en cada terraza de Badajoz y cuánto te cuesta la caña."
    />
    <title>Sol y Cerveza · Terrazas de Badajoz al sol</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- First paint: start the venue data and the basemap connection early. -->
    <link
      rel="preload"
      href="./data/terraces.json"
      as="fetch"
      type="application/json"
      crossorigin
    />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- The card back's bot check (Turnstile): only on the card back, so just
         the DNS lookup. The build adds a preconnect to the prices API when it
         has one (vite.config.ts). -->
    <link rel="dns-prefetch" href="https://challenges.cloudflare.com" />
    <!-- Link previews (docs/design/README.md §11). URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sol y Cerveza" />
    <meta property="og:title" content="Sol y Cerveza" />
    <meta
      property="og:description"
      content="Descubre hasta qué hora da el sol en cada terraza de Badajoz y cuánto te cuesta la caña."
    />
    <meta property="og:url" content="https://isroma.github.io/sol-y-cerveza/" />
    <meta
      property="og:image"
      content="https://isroma.github.io/sol-y-cerveza/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sol y Cerveza: terrazas de Badajoz al sol"
    />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

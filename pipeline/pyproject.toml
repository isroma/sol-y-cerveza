[project]
name = "solycerveza"
version = "0.1.0"
description = "Data pipeline: Badajoz terraces and their sun/shade horizon profiles."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.2.0", "ruff>=0.17.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF", "ANN", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

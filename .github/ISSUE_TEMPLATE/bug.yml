name: Bug
description: Something is wrong (including wrong sun/shade results)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: 'For wrong sun/shade results: the venue, the day and time you were there, and what you saw (sun or shade on the tables).'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Browser and device (for example Safari on iPhone 15, Chrome on a Windows laptop).

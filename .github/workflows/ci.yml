name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Runs for pushes to main are never
# cancelled (one may be deploying, see deploy-* below) and each commit gets its
# own group, so every commit on main is tested in full.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a pull request can affect, so the others are skipped (ci-ok counts
  # a skipped job as passed). The path mapping, from what each job reads, is in
  # .github/scripts/ci-changes.sh:
  #   .github/**                     all
  #   .nvmrc                         web, e2e, api
  #   .editorconfig                  web, api (prettier)
  #   .gitignore                     web, api, pipeline (prettier, oxlint, ruff)
  #   web/public/data/terraces.json  web, e2e, pipeline (pipeline/tests/test_build.py)
  #   web/src/data/**                web, e2e, api (api/src imports from it)
  #   web/ios/**, web/android/**     none
  #   web/ unit tests, lint/format config   web
  #   web/** otherwise               web, e2e
  #   api/**                         api
  #   pipeline/**                    pipeline
  #   anything else (docs/, README.md, CLAUDE.md, ...)   none
  # Pushes to main run everything. A PR is diffed as the merge commit GitHub
  # tests (HEAD) against its first parent, the base it merges into; if that
  # diff can't be computed, everything runs. Jobs run unless an output is
  # exactly 'false', so a missing output also runs them.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.paths.outputs.web }}
      e2e: ${{ steps.paths.outputs.e2e }}
      api: ${{ steps.paths.outputs.api }}
      pipeline: ${{ steps.paths.outputs.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents; only the script's files are needed.
          fetch-depth: 2
          sparse-checkout: .github
      - name: List the jobs this change affects
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        # -z: paths unquoted, whatever characters they hold. --no-renames: a
        # rename lists both paths, and needs no file contents (sparse checkout).
        # Any failure in the PR branch (no merge commit, git, the script) falls
        # through to running everything.
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] &&
            git rev-parse --verify --quiet 'HEAD^2' > /dev/null &&
            result=$(git diff -z --name-only --no-renames 'HEAD^1' HEAD |
              .github/scripts/ci-changes.sh -z); then
            :
          else
            echo "No pull request diff: running every job."
            result=$(.github/scripts/ci-changes.sh --all)
          fi
          printf '%s\n' "$result" | tee -a "$GITHUB_OUTPUT"

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  pipeline:
    name: pipeline
    needs: changes
    if: needs.changes.outputs.pipeline != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: pipeline
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  # Browser smoke tests: the real app and map in Chromium (web/e2e/), one job per
  # group of Playwright projects, each starting only the web servers it needs
  # (E2E_PROJECTS in web/playwright.config.ts). The slowest job gates ci-ok, so
  # the groups are balanced: the two reports projects share their server and a
  # job of their own, leaving phone and desktop 16 tests each.
  e2e:
    name: e2e (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: phone
            projects: phone
          - group: desktop
            projects: desktop
          - group: reports
            projects: reports-phone,reports-desktop
          - group: offline
            projects: offline
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # The runner image already has every library Chromium links against, so
      # `install-deps` only added nine font packages from the Ubuntu mirror (CJK,
      # Thai, unifont, X11 fonts; none is a fallback for the UI's Latin text, and
      # no test compares pixels): about 11 s a job, and over 2 min when the
      # mirror stalls. It runs only if a library is missing or no binary is found.
      # Playwright skips its own launch check once DEPENDENCIES_VALIDATED is in
      # the cached browser folder, so this check stands in for it; a missing
      # library would fail the launch, never pass a test.
      - name: Install Chromium's system libraries if any is missing
        run: |
          bins=$(find ~/.cache/ms-playwright -path '*chromium*' -type f \
            \( -name chrome -o -name chrome-headless-shell -o -name '*.so' -o -name '*.so.*' \))
          missing=$(printf '%s\n' "$bins" | xargs -d '\n' ldd 2>/dev/null | grep 'not found' || true)
          if [ -z "$bins" ]; then
            echo "No Chromium binary found: installing its system libraries."
            npx playwright install-deps chromium
          elif [ -n "$missing" ]; then
            printf 'Missing libraries:\n%s\n' "$missing"
            npx playwright install-deps chromium
          else
            echo "Every library Chromium needs is installed."
          fi
      - run: npm run e2e
        env:
          E2E_PROJECTS: ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dry
      # Applies every migration to a fresh local D1, so a broken migration fails here
      # and not in deploy-api.yml. CI=true makes wrangler answer its prompt with yes.
      - name: Apply the D1 migrations locally
        run: npx wrangler d1 migrations apply sol-y-cerveza --local
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'

  # Single required check for the main ruleset, so jobs can be added or renamed freely.
  # A job the changes filter skipped counts as passed on a PR; a failed or
  # cancelled one, changes included, fails it. A failed changes job also skips
  # the jobs after it, which is why it is listed here. On main nothing may be
  # skipped, since ci-ok gates the deploys.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, web, e2e, pipeline, api]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Fail if a job was skipped outside a pull request
        if: github.event_name != 'pull_request' && contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All required jobs passed"

  # Deploys main once CI has passed on it. They run in this push-triggered
  # workflow, so they build github.sha, the commit just tested, and no ref comes
  # from another event. Skipped on PRs; ci-ok does not depend on them.
  #
  # The Pages artifact is built while the tests run (building needs no test
  # result, and has no secrets or write access); only the deploy waits for
  # ci-ok, and it is skipped if the build was (main moved on) or failed.
  pages-build:
    name: pages-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/build-pages.yml

  deploy-pages:
    name: deploy-pages
    needs: [ci-ok, pages-build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.pages-build.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      built: true

  deploy-api:
    name: deploy-api
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-api.yml

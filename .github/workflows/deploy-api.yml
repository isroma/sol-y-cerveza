name: Deploy API to Cloudflare

# Applies the D1 migrations and deploys the Worker (api/) after CI has passed on
# main. Inert until the owner sets the repository variable DEPLOY_API to "true"
# and adds the secrets (api/README.md, "Deploys from GitHub").
#
# It runs after every green CI on main, not only when api/ changed: both steps
# are idempotent (no pending migration is a no-op, and the same code deploys
# the same Worker), and diffing against the parent commit would miss an api/
# change whose own CI run on main was cancelled by a newer push.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and never cancel one between its migration and
# its deploy. GitHub drops an older pending run when a newer one queues.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  # An older commit (a late CI run, a re-run) must not roll back a newer Worker;
  # the run for main's tip deploys everything up to it.
  latest:
    name: latest
    # workflow_run: only CI runs for pushes to main that passed (a fork PR from a
    # branch named main also matches `branches`, hence the event check).
    if: >-
      vars.DEPLOY_API == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - name: Deploy only main's current tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The commit CI tested; for a manual run, the commit it was started on.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main is now at $tip, whose own run deploys it."
          fi

  deploy:
    name: deploy
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare
    defaults:
      run:
        working-directory: api
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.latest.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      # Migrations apply before the new code is live, so each one must work with
      # the Worker that is still running (api/README.md). CI=true answers yes.
      - name: Apply the D1 migrations
        run: npx wrangler d1 migrations apply sol-y-cerveza --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

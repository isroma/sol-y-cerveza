name: Deploy API to Cloudflare

# Applies the D1 migrations and deploys the Worker (api/). CI (ci.yml, job
# deploy-api) calls this once ci-ok has passed on a push to main, so it deploys
# the commit that push brought and CI tested: github.sha, the default checkout.
# It can also be run by hand on main. Inert until the owner sets the repository
# variable DEPLOY_API to "true" and adds the secrets to the cloudflare
# environment (api/README.md, "Deploys from GitHub").
#
# It deploys only what the live Worker is not already running. The deploy job
# builds the Worker without uploading it and fingerprints that build (the
# bundle, wrangler.toml, the migrations and the wrangler version:
# api/scripts/deployCheck.ts), then asks the live API for its build
# (GET /v1/version). Only when the answer is that same fingerprint does it
# skip the migrations and the upload; any other answer (another build, null,
# an error, no answer, no PRICES_API) deploys as before. A skip rule from
# bookkeeping (did api/ change? a recorded SHA?) would fail silently: the
# Worker also bundles web/src/data/, and diffing against the parent commit
# misses an api/ change whose own deploy was skipped because a newer commit
# had landed. After uploading, with the fingerprint as the BUILD_ID variable,
# it waits for the live API to report that build and fails if it never does,
# so a deploy that did not take effect turns the run red.
#
# Its only secrets are CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, secrets
# of the cloudflare environment the deploy job declares. When ci.yml calls it,
# they resolve only because the caller job has `secrets: inherit`: with nothing
# passed (and the two declared under workflow_call.secrets), both came through
# empty (run 45839292704). Keep this file free of any other secret, since
# inherit makes all of them available here.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Early skip for a commit that is no longer main's tip (a late CI run, a
  # re-run), so it does not queue behind the deploy lock, where it could
  # displace the tip's pending deploy. The deploy job checks again under the
  # lock; that second check is what guarantees the order.
  latest:
    name: latest
    # Manual runs: main only. ci.yml calls it for pushes to main only.
    if: >-
      vars.DEPLOY_API == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - name: Deploy only main's current tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main is now at $tip, whose own run deploys it."
          fi

  deploy:
    name: deploy
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never two deploys at once, from CI and from manual runs alike, and never
    # cancel one between its migration and its deploy. GitHub keeps one pending
    # job per group and does not promise queue order, so the tip is checked again
    # here, while holding the lock: an older commit never rolls back a newer one.
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    environment:
      name: cloudflare
    defaults:
      run:
        working-directory: api
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Still main's tip
        id: tip
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main moved to $tip while this run waited; its own run deploys it."
          fi
      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - if: steps.tip.outputs.deploy == 'true'
        run: npm ci
      # Needs no credentials, like CI's build:dry. The deploy below builds the
      # same bundle again: the build is deterministic, whatever the checkout path.
      - name: Fingerprint the build
        id: build
        if: steps.tip.outputs.deploy == 'true'
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
          node scripts/deploy-check.ts fingerprint "$RUNNER_TEMP/worker"
      # Skips only when the live Worker reports this exact build; anything else deploys.
      - name: Ask the live API for its build
        id: live
        if: steps.tip.outputs.deploy == 'true'
        run: node scripts/deploy-check.ts decide
        env:
          API_URL: ${{ vars.PRICES_API }}
          BUILD: ${{ steps.build.outputs.build }}
      # Migrations apply before the new code is live, so each one must work with
      # the Worker that is still running (api/README.md). CI=true answers yes.
      - name: Apply the D1 migrations
        if: steps.tip.outputs.deploy == 'true' && steps.live.outputs.deploy == 'true'
        run: npx wrangler d1 migrations apply sol-y-cerveza --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # BUILD_ID is a plain variable next to wrangler.toml's [vars]; it does not
      # change the bundle, so the fingerprint stays that of this build.
      - name: Deploy the Worker
        if: steps.tip.outputs.deploy == 'true' && steps.live.outputs.deploy == 'true'
        run: npx wrangler deploy --var "BUILD_ID:$BUILD"
        env:
          BUILD: ${{ steps.build.outputs.build }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Up to 13 tries 5 s apart (about a minute): fails unless the live API
      # reports this build. Without PRICES_API it can only warn.
      - name: Check the live API runs this build
        if: steps.tip.outputs.deploy == 'true' && steps.live.outputs.deploy == 'true'
        run: node scripts/deploy-check.ts verify
        env:
          API_URL: ${{ vars.PRICES_API }}
          BUILD: ${{ steps.build.outputs.build }}

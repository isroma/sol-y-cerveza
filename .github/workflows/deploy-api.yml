name: Deploy API to Cloudflare

# Applies the D1 migrations and deploys the Worker (api/). CI (ci.yml, job
# deploy-api) calls this once ci-ok has passed on a push to main, so it deploys
# the commit that push brought and CI tested: github.sha, the default checkout.
# It can also be run by hand on main. Inert until the owner sets the repository
# variable DEPLOY_API to "true" and adds the secrets to the cloudflare
# environment (api/README.md, "Deploys from GitHub").
#
# It runs after every green CI on main, not only when api/ changed: both steps
# are idempotent (no pending migration is a no-op, and the same code deploys
# the same Worker), and diffing against the parent commit would miss an api/
# change whose own deploy was skipped because a newer commit had landed.
#
# Its only secrets are CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, secrets
# of the cloudflare environment the deploy job declares. When ci.yml calls it,
# they resolve only because the caller job has `secrets: inherit`: with nothing
# passed (and the two declared under workflow_call.secrets), both came through
# empty (run 45839292704). Keep this file free of any other secret, since
# inherit makes all of them available here.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Early skip for a commit that is no longer main's tip (a late CI run, a
  # re-run), so it does not queue behind the deploy lock, where it could
  # displace the tip's pending deploy. The deploy job checks again under the
  # lock; that second check is what guarantees the order.
  latest:
    name: latest
    # Manual runs: main only. ci.yml calls it for pushes to main only.
    if: >-
      vars.DEPLOY_API == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - name: Deploy only main's current tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main is now at $tip, whose own run deploys it."
          fi

  deploy:
    name: deploy
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never two deploys at once, from CI and from manual runs alike, and never
    # cancel one between its migration and its deploy. GitHub keeps one pending
    # job per group and does not promise queue order, so the tip is checked again
    # here, while holding the lock: an older commit never rolls back a newer one.
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    environment:
      name: cloudflare
    defaults:
      run:
        working-directory: api
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Still main's tip
        id: tip
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main moved to $tip while this run waited; its own run deploys it."
          fi
      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - if: steps.tip.outputs.deploy == 'true'
        run: npm ci
      # Migrations apply before the new code is live, so each one must work with
      # the Worker that is still running (api/README.md). CI=true answers yes.
      - name: Apply the D1 migrations
        if: steps.tip.outputs.deploy == 'true'
        run: npx wrangler d1 migrations apply sol-y-cerveza --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        if: steps.tip.outputs.deploy == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

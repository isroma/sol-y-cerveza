name: Build web for GitHub Pages

# Builds the Pages artifact (`github-pages`) of github.sha, the default checkout,
# for deploy-pages.yml's deploy job in the same run. CI (ci.yml, job
# pages-build) calls it on a push to main while the tests run, since building
# needs no test result and deploying does: the deploy itself still waits for
# ci-ok. deploy-pages.yml calls it for its manual runs. It needs no secrets and
# only reads the repository.
on:
  workflow_call:
    outputs:
      deploy:
        description: "'true' when github.sha is main's tip and its artifact was built"
        value: ${{ jobs.latest.outputs.deploy }}

permissions:
  contents: read

jobs:
  # Early skip for a commit that is no longer main's tip (a late CI run, a
  # re-run): it does not build, and it does not queue behind the deploy lock,
  # where it could displace the tip's pending deploy. The deploy job checks again
  # under the lock; that second check is what guarantees the order.
  latest:
    name: latest
    # Manual runs: main only. ci.yml calls it for pushes to main only.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - name: Deploy only main's current tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main is now at $tip, whose own run deploys it."
          fi

  build:
    name: build
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Price suggestions (api/). Unset, the app shows curated prices only.
          VITE_PRICES_API: ${{ vars.PRICES_API }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          # Offline cache kill switch: "1" ships a self-removing service worker (docs/operations.md).
          VITE_SW_KILL_SWITCH: ${{ vars.SW_KILL_SWITCH }}
      # Tree crowns, LiDAR buildings and the bridge mesh (kept off main): the height-tiles branch's
      # trees.json, buildings.json and bridge-mesh.json become data/ (docs/pipeline.md, "Map
      # shadows"). The map casts its shadows from the first two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: height-tiles
          path: height-tiles
          persist-credentials: false
      - name: Add the tree crowns, LiDAR buildings and bridge mesh
        run: |
          cp ../height-tiles/trees.json dist/data/trees.json
          cp ../height-tiles/buildings.json dist/data/buildings.json
          # Until height-tiles has it, the map draws no bridge mesh and keeps the basemap's roads.
          if [ -f ../height-tiles/bridge-mesh.json ]; then
            cp ../height-tiles/bridge-mesh.json dist/data/bridge-mesh.json
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

name: Deploy web to GitHub Pages

# CI (ci.yml, job deploy-pages) calls this once ci-ok has passed on a push to
# main, with `built: true`: its pages-build job has already built the commit
# that push brought and CI tested (github.sha, the default checkout) with
# build-pages.yml, while the tests ran, and this run deploys that artifact. No
# ref comes from another workflow's event. Manual runs build main as it is now
# and deploy it at once (the service-worker kill switch in docs/operations.md).
on:
  workflow_call:
    inputs:
      built:
        description: The caller has built this run's Pages artifact with build-pages.yml.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Manual runs (and a caller that has not built): the tip check and the build.
  build:
    name: build
    if: ${{ !inputs.built }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-pages.yml

  deploy:
    name: deploy
    needs: build
    # The build ran here and built main's tip, or the caller built it. Never
    # after a cancelled run; a failed build skips the deploy.
    if: >-
      !cancelled() &&
      (inputs.built ||
       (needs.build.result == 'success' && needs.build.outputs.deploy == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # One Pages deploy at a time, from CI and from manual runs alike: a newer one
    # waits instead of cancelling one mid-deploy. GitHub keeps one pending job per
    # group and does not promise queue order, so the tip is checked again here,
    # while holding the lock: an older commit never overwrites a newer one.
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Still main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main moved to $tip while this run waited; its own run deploys it."
          fi
      - id: deployment
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Deploy web to GitHub Pages

# CI (ci.yml, job deploy-pages) calls this once ci-ok has passed on a push to
# main, so it builds the commit that push brought and CI tested: github.sha, the
# default checkout. No ref comes from another workflow's event. Manual runs
# deploy main as it is now, at once (the service-worker kill switch in docs/operations.md).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Early skip for a commit that is no longer main's tip (a late CI run, a
  # re-run): it does not build, and it does not queue behind the deploy lock,
  # where it could displace the tip's pending deploy. The deploy job checks again
  # under the lock; that second check is what guarantees the order.
  latest:
    name: latest
    # Manual runs: main only. ci.yml calls it for pushes to main only.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - name: Deploy only main's current tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main is now at $tip, whose own run deploys it."
          fi

  build:
    name: build
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Price suggestions (api/). Unset, the app shows curated prices only.
          VITE_PRICES_API: ${{ vars.PRICES_API }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          # Offline cache kill switch: "1" ships a self-removing service worker (docs/operations.md).
          VITE_SW_KILL_SWITCH: ${{ vars.SW_KILL_SWITCH }}
      # Tree crowns and LiDAR buildings (kept off main): the height-tiles branch's trees.json and
      # buildings.json become data/ (docs/pipeline.md, "Shadow height tiles"). The client no longer reads
      # the branch's height tiles, so they aren't deployed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: height-tiles
          path: height-tiles
          persist-credentials: false
      - name: Add the tree crowns and LiDAR buildings
        run: |
          cp ../height-tiles/trees.json dist/data/trees.json
          cp ../height-tiles/buildings.json dist/data/buildings.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # One Pages deploy at a time, from CI and from manual runs alike: a newer one
    # waits instead of cancelling one mid-deploy. GitHub keeps one pending job per
    # group and does not promise queue order, so the tip is checked again here,
    # while holding the lock: an older commit never overwrites a newer one.
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Still main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main moved to $tip while this run waited; its own run deploys it."
          fi
      - id: deployment
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

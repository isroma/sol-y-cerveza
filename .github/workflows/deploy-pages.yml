name: Deploy web to GitHub Pages

# Deploys main only after CI has passed on that exact commit, so a combined
# breakage on main (each PR green alone) never ships. Manual runs deploy main as
# it is now (the README's service-worker kill switch uses them).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer run waits instead of cancelling one mid-deploy,
# and GitHub drops an older pending run when a newer one queues. The `latest`
# job below skips any commit that is no longer main's tip, so an older commit
# (a late CI run, a re-run) never overwrites a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  latest:
    name: latest
    # workflow_run: only CI runs for pushes to main that passed (a fork PR from a
    # branch named main also matches `branches`, hence the event check).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - name: Deploy only main's current tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The commit CI tested; for a manual run, the commit it was started on.
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/main" -q .commit.sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main is now at $tip, whose own run deploys it."
          fi

  build:
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.latest.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Price suggestions (api/). Unset, the app shows curated prices only.
          VITE_PRICES_API: ${{ vars.PRICES_API }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          # Offline cache kill switch: "1" ships a self-removing service worker (README).
          VITE_SW_KILL_SWITCH: ${{ vars.SW_KILL_SWITCH }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

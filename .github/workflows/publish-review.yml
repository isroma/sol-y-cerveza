name: Publish review

# The admin view's Publish button (web/plugins/admin/publish.ts) pushes a data/venue-review-*
# branch with git only: on the admin's network api.github.com is unreachable.
# This is the first, unprivileged half: it checks the push and holds no secrets.
# GitHub runs a push workflow from the pushed commit, so whoever pushes can edit
# this file; nothing here may be trusted. When it succeeds, publish-review-pr.yml
# (always run from main's copy) checks the branch again on its own and opens the
# PR with PUBLISH_TOKEN. publish-review-pr.yml names this workflow by its name.
on:
  push:
    branches: ['data/venue-review-*']

permissions:
  contents: read

concurrency:
  group: publish-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so origin/main and the merge base are there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A fast signal only: publish-review-pr.yml repeats this check with the same
      # list (PUBLISHED in web/plugins/admin/publish.ts) before using the token.
      - name: Check the branch only changes the published data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          changed=$(git diff --no-renames --name-only origin/main...HEAD)
          other=''
          while IFS= read -r file; do
            case "$file" in
              '' | pipeline/data/venue_review.csv | pipeline/data/venue_prices.csv | pipeline/data/sun_corrections.csv | web/public/data/terraces.json) ;;
              *) other="$other$file"$'\n' ;;
            esac
          done <<< "$changed"
          if [ -n "$other" ]; then
            echo "::error::$BRANCH changes files Publish never commits, so it is not merged."
            printf '%s' "$other"
            exit 1
          fi
          printf 'Changed files:\n%s\n' "$changed"

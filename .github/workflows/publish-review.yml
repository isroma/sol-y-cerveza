name: Publish review

# The admin view's Publish button (web/publish.ts) pushes a data/venue-review-*
# branch with git only: on the admin's network api.github.com is unreachable.
# This opens the PR and enables auto-merge. It uses PUBLISH_TOKEN, a
# fine-grained token of the repo owner (Contents and Pull requests: read and
# write, this repository only), because PRs opened or merged with GITHUB_TOKEN
# trigger no workflows, so CI and the Pages deploy would never run.
on:
  push:
    branches: ['data/venue-review-*']

permissions:
  contents: read

concurrency:
  group: publish-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the PUBLISH_TOKEN secret (see CLAUDE.md, Admin)."
            exit 1
          fi
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -z "$pr" ]; then
            message=$(gh api "repos/$REPO/commits/$SHA" -q .commit.message)
            pr=$(gh pr create -R "$REPO" --head "$BRANCH" --base main \
              --title "$(printf '%s\n' "$message" | head -n 1)" \
              --body "$(printf '%s\n' "$message" | tail -n +3)")
          fi
          gh pr merge "$pr" -R "$REPO" --auto --squash
          echo "$pr" >> "$GITHUB_STEP_SUMMARY"

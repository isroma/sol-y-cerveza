# Price suggestions API (see src/index.ts). Deploy: `npm run deploy`.
name = "sol-y-cerveza-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Browser origins allowed to call the API (the site and the local dev servers).
ALLOWED_ORIGINS = "https://isroma.github.io,http://localhost:5173,http://localhost:5190"
# The published data, used to reject suggestions for unknown venues.
TERRACES_URL = "https://isroma.github.io/sol-y-cerveza/data/terraces.json"

[[d1_databases]]
binding = "DB"
database_name = "sol-y-cerveza"
# Filled in by `wrangler d1 create sol-y-cerveza` on first setup.
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets (`wrangler secret put <NAME>`; locally in .dev.vars):
# TURNSTILE_SECRET, ADMIN_TOKEN, IP_SALT
